name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teamflow
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: teamflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U teamflow -d teamflow"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://teamflow:teamflow@localhost:5432/teamflow
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: ci-secret-key-with-more-than-thirty-two-characters
      ENVIRONMENT: development
      SEED_DEMO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff==0.9.2 mypy==1.14.1 types-redis==4.6.0.20241004
      - run: alembic upgrade head
      - run: alembic downgrade -1
      - run: alembic upgrade head
      - run: ruff check app tests
      - run: mypy app --ignore-missing-imports
      - run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/teamflow-vite.log 2>&1 &
      - run: sleep 2
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t teamflow-api:ci .
      - name: Build frontend image
        run: docker build -f frontend-react/Dockerfile -t teamflow-web:ci frontend-react
